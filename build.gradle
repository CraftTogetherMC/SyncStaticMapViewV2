plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'de.stondragonlp'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://repo.phoenix616.dev/" }
    maven { url = "https://repo.minebench.de/" }
    maven { url = 'https://repo.papermc.io/repository/maven-public/'}
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT")
    compileOnly "net.md-5:bungeecord-chat:1.20-R0.2"
    compileOnly "com.mojang:datafixerupper:8.0.16"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "com.mojang:javabridge:2.0.25"
    compileOnly "com.mojang:authlib:5.0.51"
}

tasks.named("runServer") {
    minecraftVersion("1.20.4")
    dependsOn("copyPluginJar")
    jvmArgs(
            "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    )
}

tasks.register("copyPluginJar", Copy) {
    dependsOn(tasks.named("jar")) // 🧩 wichtig: warte auf JAR-Datei
    from(layout.buildDirectory.file("libs/${project.name}-${project.version}.jar"))
    into("run/plugins/")
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
